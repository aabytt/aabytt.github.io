<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerial Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #111111;
            --bg-hover: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #bbbbbb;
            --text-muted: #777777;
            --accent: #ffffff;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Crimson Text', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .controls {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .controls.hidden { transform: translateY(-100%); }

        .search-box { flex: 1; min-width: 220px; position: relative; }
        .search-box input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.6rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1rem;
            border-radius: 6px;
        }
        .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .language-selector {
            padding: 0.85rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1rem;
            border-radius: 6px;
        }

        .filter-btn, .quality-btn {
            padding: 0.75rem 1.1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            border-radius: 6px;
            position: relative;
        }

        .filter-btn:hover, .quality-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .filter-btn.active, .quality-btn.active { background: var(--accent); color: var(--bg-primary); }

        .counter-badge {
            background: #f5576c;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.75rem;
            margin-left: 6px;
            font-weight: 700;
        }

        .gallery {
            padding: 1.2rem 1rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
            margin-top: 75px;
        }

        .video-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .video-preview-container { position: relative; aspect-ratio: 16/9; overflow: hidden; }
        .video-preview { width: 100%; height: 100%; object-fit: cover; }

        .favorite-btn {
            position: absolute; top: 12px; left: 12px;
            background: rgba(0,0,0,0.8); border: none; color: white;
            width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; z-index: 12; font-size: 1.45rem;
        }

        .poi-badge, .quality-badge {
            position: absolute;
            background: rgba(0,0,0,0.85); color: white;
            padding: 5px 11px; border-radius: 20px;
            font-size: 0.82rem; font-weight: 600; z-index: 11;
        }
        .poi-badge { top: 12px; right: 12px; }
        .quality-badge { bottom: 12px; right: 12px; font-size: 0.7rem; border: 1px solid rgba(255,255,255,0.1); }
        .quality-badge.4k-hdr { background: linear-gradient(90deg, #c8102e, #e31c2d); }

        .bottom-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 55%, rgba(0,0,0,0.9));
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 1.2rem; color: white; z-index: 8;
        }

        /* Modal */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; opacity: 0; visibility: hidden;
            transition: all 0.4s ease;
        }
        .modal.active { opacity: 1; visibility: visible; }

        .modal-content {
            width: 92%; max-width: 1400px;
            background: var(--bg-secondary);
            border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border);
        }

        .modal-video-container { position: relative; background: #000; }
        .modal-video { width: 100%; max-height: 85vh; }

        .modal-close {
            position: absolute; top: 20px; right: 20px;
            font-size: 2.4rem; background: rgba(0,0,0,0.8);
            color: white; width: 52px; height: 52px;
            border-radius: 50%; border: none; cursor: pointer; z-index: 40;
        }

        .video-name-overlay {
            position: absolute;
            top: 30px; left: 30px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            z-index: 25;
            backdrop-filter: blur(8px);
        }

        .poi-overlay {
            position: absolute;
            bottom: 50px; left: 30px; right: 30px;
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 1.35rem;
            padding: 16px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 25;
            backdrop-filter: blur(8px);
        }
        .poi-overlay.show { opacity: 1; }

        .modal-quality-badge {
            position: absolute;
            bottom: 30px; right: 30px;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 25;
        }
        .modal-quality-badge.4k-hdr { background: linear-gradient(90deg, #c8102e, #e31c2d); }

        .modal-footer {
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .quality-link {
            padding: 0.7rem 1.3rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 6px;
            margin: 3px;
        }

        @media (max-width: 768px) {
            .video-name-overlay { top: 20px; left: 20px; font-size: 1.45rem; padding: 10px 18px; }
            .poi-overlay { bottom: 30px; left: 20px; right: 20px; font-size: 1.15rem; padding: 12px 18px; }
            .modal-quality-badge { bottom: 25px; right: 25px; }
        }
    </style>
</head>
<body>
    <div class="controls" id="controls">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search locations...">
        </div>

        <select id="languageSelect" class="language-selector"></select>

        <div style="display:flex; gap:0.6rem; align-items:center;">
            <button class="filter-btn active" id="allFilter">
                All <span class="counter-badge" id="allCount">0</span>
            </button>
            <button class="filter-btn favorites-btn" id="favoritesFilter">
                ❤️ Favorites <span class="counter-badge" id="favoritesCount" style="display:none;">0</span>
            </button>
        </div>


    </div>

    <div class="gallery" id="gallery"></div>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-video-container">
                <button class="modal-close" id="closeModal">×</button>
                <video id="modalVideo" class="modal-video" controls autoplay loop></video>
                
                <div class="video-name-overlay" id="videoNameOverlay"></div>
                <div class="poi-overlay" id="poiOverlay"></div>
                <div class="modal-quality-badge" id="modalQualityBadge"></div>
            </div>
            
            <div class="modal-footer">
                <div class="quality-links" id="modalQualityLinks" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                <button class="modal-control-btn" id="modalFavoriteBtn">❤️ Favorite</button>
            </div>
        </div>
    </div>

    <script>
        let videosData = [], stringsData = {}, currentLanguage = 'en-US';
        let searchQuery = '', qualityFilter = 'all', currentVideoFilter = 'all';
        let favorites = JSON.parse(localStorage.getItem('aerial-favorites') || '[]');
        let currentVideoId = null, currentPOIs = {}, poiTimeout;

        const languageOptions = [
            {value: 'ar-AE', content: 'العربية'}, {value: 'be-BY', content: 'Беларуская'}, {value: 'ca-ES', content: 'Català'},
            {value: 'cs-CZ', content: 'Čeština'}, {value: 'da-DK', content: 'Dansk'}, {value: 'de-DE', content: 'Deutsch'},
            {value: 'el-GR', content: 'ελληνικά'}, {value: 'en-AU', content: 'English (Australia)'}, {value: 'en-GB', content: 'English (United Kingdom)'},
            {value: 'en-US', content: 'English (United States)'}, {value: 'es-419', content: 'Español (Latinoamérica)'}, {value: 'es-ES', content: 'Español'},
            {value: 'fi-FI', content: 'Suomi'}, {value: 'fr-CA', content: 'Français (Canada)'}, {value: 'fr-FR', content: 'Français'},
            {value: 'he-IL', content: 'עברית'}, {value: 'hi-IN', content: 'हिन्दी'}, {value: 'hr-HR', content: 'Hrvatski'},
            {value: 'hu-HU', content: 'Magyar'}, {value: 'id-ID', content: 'Bahasa Indonesia'}, {value: 'it-IT', content: 'Italiano'},
            {value: 'ja-JP', content: '日本語'}, {value: 'ko-KR', content: '한국어'}, {value: 'ms-MY', content: 'Bahasa Melayu'},
            {value: 'nb-NO', content: 'Norsk'}, {value: 'nl-NL', content: 'Nederlands'}, {value: 'pl-PL', content: 'Polski'},
            {value: 'pt-BR', content: 'Português (Brasil)'}, {value: 'pt-PT', content: 'Português (Portugal)'}, {value: 'ro-RO', content: 'Română'},
            {value: 'ru-RU', content: 'Русский'}, {value: 'sk-SK', content: 'Slovenčina'}, {value: 'sl-SI', content: 'Slovenščina'},
            {value: 'sv-SE', content: 'Svenska'}, {value: 'th-TH', content: 'ไทย'}, {value: 'tr-TR', content: 'Türkçe'},
            {value: 'uk-UA', content: 'Українська'}, {value: 'vi-VN', content: 'Tiếng Việt'}, {value: 'zh-CN', content: '中文 (中国大陆)'},
            {value: 'zh-HK', content: '中文（香港）'}, {value: 'zh-TW', content: '中文 (台灣)'}
        ];

        async function loadData(language = 'en-US') {
            try {
                currentLanguage = language;
                const [videosRes, stringsRes] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/aabytt/custom-screensaver-aerial/refs/heads/new-videos-json/assets/videos.json'),
                    fetch(`https://raw.githubusercontent.com/aabytt/custom-screensaver-aerial/refs/heads/new-videos-json/assets/locales/${language}.json`)
                ]);
                videosData = (await videosRes.json()).assets || [];
                stringsData = (await stringsRes.json()).strings || {};

                populateLanguageSelector();
                updateStats();
                renderGallery();
            } catch (e) { console.error(e); }
        }

        function populateLanguageSelector() {
            const select = document.getElementById('languageSelect');
            select.innerHTML = '';
            languageOptions.forEach(lang => {
                const opt = document.createElement('option');
                opt.value = lang.value;
                opt.textContent = lang.content;
                if (lang.value === currentLanguage) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function updateStats() {
            document.getElementById('allCount').textContent = videosData.length;
            updateFavoritesCount();
        }

        function updateFavoritesCount() {
            const count = favorites.length;
            const el = document.getElementById('favoritesCount');
            el.textContent = count;
            el.style.display = count > 0 ? 'inline' : 'none';
        }

        function toggleFavorite(videoId, e) {
            if (e) e.stopPropagation();
            const idx = favorites.indexOf(videoId);
            idx > -1 ? favorites.splice(idx, 1) : favorites.push(videoId);
            localStorage.setItem('aerial-favorites', JSON.stringify(favorites));
            updateFavoritesCount();
            renderGallery();
            if (currentVideoId) updateModalFavoriteBtn();
        }

        function getVideoName(video) {
            return stringsData[video.localizedNameKey] || video.localizedNameKey || 'Unknown';
        }

        function getQualityBadge(video) {
            if (video['url-4K-HDR']) return { text: '4K HDR', cls: '4k-hdr' };
            if (video['url-4K-SDR'] || video['url-4K-SDR-240FPS']) return { text: '4K', cls: '' };
            if (video['url-1080-HDR']) return { text: '1080 HDR', cls: '' };
            return { text: '1080p', cls: '' };
        }

        function filterVideos() {
            return videosData.filter(v => {
                const name = getVideoName(v).toLowerCase();
                return (!searchQuery || name.includes(searchQuery.toLowerCase())) &&
                       (qualityFilter === 'all' || 
                        (qualityFilter === '4K-HDR' && v['url-4K-HDR']) ||
                        (qualityFilter === '4K-SDR' && (v['url-4K-SDR'] || v['url-4K-SDR-240FPS'])) ||
                        (qualityFilter === '1080-SDR' && (v['url-1080-SDR'] || v['url-1080-H264']))) &&
                       (currentVideoFilter === 'all' || favorites.includes(v.id));
            });
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const filtered = filterVideos();

            if (!filtered.length) {
                gallery.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:6rem 1rem;color:#777;">No videos found.</div>';
                return;
            }

            gallery.innerHTML = filtered.map(video => {
                const name = getVideoName(video);
                const q = getQualityBadge(video);
                const fav = favorites.includes(video.id);
                return `
                    <div class="video-card" data-id="${video.id}">
                        <div class="video-preview-container">
                            <img class="video-preview" src="${video.previewImage}" loading="lazy">
                            <button class="favorite-btn ${fav?'active':''}" onclick="toggleFavorite('${video.id}', event)">${fav?'❤️':'🤍'}</button>
                            <div class="poi-badge">${Object.keys(video.pointsOfInterest||{}).length} POI</div>
                            <div class="quality-badge ${q.cls}">${q.text}</div>
                            <div class="bottom-overlay">
                                <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.45rem;">${name}</h3>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            document.querySelectorAll('.video-card').forEach(card => {
                card.addEventListener('click', e => {
                    if (!e.target.closest('.favorite-btn')) {
                        const video = videosData.find(v => v.id === card.dataset.id);
                        if (video) openModal(video);
                    }
                });
            });
        }

        function openModal(video) {
            currentVideoId = video.id;
            const name = getVideoName(video);
            const q = getQualityBadge(video);

            document.getElementById('videoNameOverlay').textContent = name;
            const badgeEl = document.getElementById('modalQualityBadge');
            badgeEl.innerHTML = `<span class="${q.cls}">${q.text}</span>`;

            const videoEl = document.getElementById('modalVideo');
            // Prefer 1080 SDR, then HDR
            videoEl.src = video['url-1080-SDR'] || video['url-1080-HDR'] || video['url-1080-H264'] || 
                          video['url-4K-SDR'] || video['url-4K-HDR'] || '';

            currentPOIs = video.pointsOfInterest || {};

            const allQualities = [
                {label: '4K HDR',     key: 'url-4K-HDR'},
                {label: '4K SDR',     key: 'url-4K-SDR'},
                {label: '4K 240FPS',  key: 'url-4K-SDR-240FPS'},
                {label: '1080 HDR',   key: 'url-1080-HDR'},
                {label: '1080p SDR',  key: 'url-1080-SDR'},
                {label: '1080 H.264', key: 'url-1080-H264'}
            ];

            const linksHTML = allQualities
                .filter(q => video[q.key])
                .map(q => `<a href="${video[q.key]}" class="quality-link" download>${q.label}</a>`)
                .join('');

            document.getElementById('modalQualityLinks').innerHTML = linksHTML || '<span style="color:#777;">No downloads available</span>';

            updateModalFavoriteBtn();
            document.getElementById('videoModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            setupPOIOverlays(videoEl);
        }

        function updateModalFavoriteBtn() {
            const btn = document.getElementById('modalFavoriteBtn');
            btn.textContent = favorites.includes(currentVideoId) ? '❤️ Favorited' : '❤️ Favorite';
        }

        function setupPOIOverlays(videoEl) {
            const overlay = document.getElementById('poiOverlay');
            videoEl.ontimeupdate = () => {
                const time = Math.floor(videoEl.currentTime);
                const key = currentPOIs[time];
                if (key) {
                    overlay.textContent = stringsData[key] || key;
                    overlay.classList.add('show');
                    clearTimeout(poiTimeout);
                    poiTimeout = setTimeout(() => overlay.classList.remove('show'), 6500);
                }
            };
        }

        function closeModal() {
            document.getElementById('modalVideo').pause();
            document.getElementById('modalVideo').src = '';
            document.getElementById('poiOverlay').classList.remove('show');
            clearTimeout(poiTimeout);
            document.getElementById('videoModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            currentVideoId = null;
        }

        let lastScroll = 0;
        window.addEventListener('scroll', () => {
            const ctrl = document.getElementById('controls');
            const curr = window.scrollY;
            ctrl.classList.toggle('hidden', curr > lastScroll && curr > 80);
            lastScroll = curr;
        });

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderGallery(); });
        document.getElementById('languageSelect').addEventListener('change', e => loadData(e.target.value));
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('videoModal').addEventListener('click', e => { if (e.target.id === 'videoModal') closeModal(); });
        document.getElementById('modalFavoriteBtn').addEventListener('click', () => currentVideoId && toggleFavorite(currentVideoId));

        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                qualityFilter = btn.dataset.quality;
                renderGallery();
            });
        });

        document.getElementById('allFilter').addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('allFilter').classList.add('active');
            currentVideoFilter = 'all';
            renderGallery();
        });

        document.getElementById('favoritesFilter').addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('favoritesFilter').classList.add('active');
            currentVideoFilter = 'favorites';
            renderGallery();
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        loadData('en-US');
    </script>
</body>
</html>
