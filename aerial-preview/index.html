<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerial Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #111111;
            --bg-hover: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #bbbbbb;
            --text-muted: #777777;
            --accent: #ffffff;
            --accent-dim: #cccccc;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Crimson Text', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            padding: 4rem 2rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4.2rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: var(--accent);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2.5rem;
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.7rem;
            font-weight: 600;
            color: var(--accent);
        }

        /* ==================== CONTROLS ==================== */
        .controls {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1.6rem 2rem;
            z-index: 100;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box { flex: 1; min-width: 260px; }
        .search-box input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1rem;
            border-radius: 4px;
        }
        .search-box input:focus { border-color: var(--accent); outline: none; }

        .language-selector {
            padding: 0.75rem 1.2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            border-radius: 4px;
            min-width: 240px;
        }

        .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn, .quality-btn {
            padding: 0.7rem 1.4rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .filter-btn:hover, .quality-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .filter-btn.active, .quality-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* ==================== MOBILE OPTIMIZATIONS ==================== */
        @media (max-width: 768px) {
            .header {
                padding: 2.5rem 1rem 1.5rem;
            }
            .header h1 {
                font-size: 2.9rem;
            }
            .stats {
                gap: 2rem;
                margin-top: 1.8rem;
            }
            .stat-number {
                font-size: 2.2rem;
            }

            .controls {
                padding: 0.9rem 1rem;
                gap: 0.7rem;
            }
            .search-box input {
                padding: 0.7rem 1rem;
                font-size: 0.96rem;
            }
            .language-selector {
                padding: 0.65rem 1rem;
                font-size: 0.95rem;
                min-width: 170px;
            }
            .filter-btn, .quality-btn {
                padding: 0.55rem 1rem;
                font-size: 0.78rem;
            }

            .gallery {
                padding: 1.6rem 1rem;
                gap: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box, .language-selector {
                min-width: auto;
            }
        }

        /* Gallery & Cards (unchanged) */
        .gallery {
            padding: 2.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2.4rem;
        }
        .gallery.list-view {
            grid-template-columns: 1fr;
            max-width: 1300px;
            margin: 0 auto;
        }

        .video-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            overflow: hidden;
            border-radius: 6px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }
        .video-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-dim);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.08);
        }

        .video-preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transition: transform 0.5s ease;
        }
        .video-card:hover .video-preview { transform: scale(1.04); }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.25) 0%,
                rgba(0,0,0,0.65) 45%,
                rgba(0,0,0,0.92) 75%,
                rgba(0,0,0,0.95) 100%
            );
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.4rem;
            z-index: 2;
            color: white;
        }

        .poi-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 0.83rem;
            font-weight: 600;
            z-index: 3;
            border: 1px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(4px);
        }

        .video-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.55rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }

        .video-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 0.9rem;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quality-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .quality-badge {
            padding: 1px 6px;
            font-size: 0.58rem;
            font-weight: 600;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--accent-dim);
            border: 1px solid rgba(255, 255, 255, 0.10);
            opacity: 0.85;
        }

        /* ====================== MODAL ====================== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
        }
        .modal.active { display: block; }

        .modal-content {
            max-width: 1480px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            max-height: 98vh;
            overflow-y: auto;
        }

        .modal-video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .modal-video {
            width: 100%;
            max-height: 88vh;
            height: auto;
            display: block;
        }

        .modal-video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
            pointer-events: none;
        }

        .modal-video-overlay * { pointer-events: auto; }

        .modal-title-overlay {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.85rem;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            max-width: 75%;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2.8rem;
            cursor: pointer;
            line-height: 1;
            margin-top: -8px;
        }
        .modal-close:hover { color: white; }

        .poi-overlay {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 16px 34px;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 500;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            max-width: 90%;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid var(--accent-dim);
        }
        .poi-overlay.show { opacity: 1; }

        .quality-links {
            margin-top: 1.2rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .quality-link {
            padding: 0.7rem 1.4rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.93rem;
            transition: all 0.3s ease;
        }
        .quality-link:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .no-results {
            text-align: center;
            padding: 6rem 2rem;
            color: var(--text-muted);
            font-size: 1.35rem;
        }

        @media (max-width: 768px) {
            .modal { padding: 0.5rem; }
            .modal-content { padding: 1rem; }
            .modal-video { max-height: 75vh; }
            .poi-overlay { bottom: 8%; font-size: 1.05rem; padding: 12px 24px; }
            .modal-title-overlay { font-size: 1.55rem; }
            .modal-video-overlay { padding: 15px 18px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="stats">
            <div class="stat"><span class="stat-number" id="totalVideos">—</span><span class="stat-label">Videos</span></div>
            <div class="stat"><span class="stat-number" id="totalPOI">—</span><span class="stat-label">Points of Interest</span></div>
            <div class="stat"><span class="stat-number" id="totalLocations">—</span><span class="stat-label">Locations</span></div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search locations, descriptions...">
        </div>
        <select id="languageSelect" class="language-selector"></select>

        <div class="filter-group">
            <button class="filter-btn active" data-quality="all">All Quality</button>
            <button class="filter-btn" data-quality="4K-HDR">4K HDR</button>
            <button class="filter-btn" data-quality="4K-SDR">4K SDR</button>
            <button class="filter-btn" data-quality="1080-HDR">1080p HDR</button>
        </div>

        <div class="view-toggle">
            <button class="quality-btn active" id="gridView">Grid</button>
            <button class="quality-btn" id="listView">List</button>
        </div>
    </div>

    <div class="gallery" id="gallery"></div>

    <!-- Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-video-container">
                <div class="modal-video-overlay">
                    <h2 class="modal-title-overlay" id="modalTitle"></h2>
                    <button class="modal-close" id="closeModal">×</button>
                </div>
                <video class="modal-video" id="modalVideo" controls></video>
                <div class="poi-overlay" id="poiOverlay"></div>
            </div>
            <div class="quality-links" id="modalQualityLinks"></div>
        </div>
    </div>

    <script>
        let videosData = [], stringsData = {}, currentLanguage = 'en-US', currentFilter = 'all', searchQuery = '';
        let currentPOIs = {}, poiTimeout = null;

        const languageOptions = [
            {value: 'ar-AE', content: 'العربية'}, {value: 'be-BY', content: 'Беларуская'}, {value: 'ca-ES', content: 'Català'},
            {value: 'cs-CZ', content: 'Čeština'}, {value: 'da-DK', content: 'Dansk'}, {value: 'de-DE', content: 'Deutsch'},
            {value: 'el-GR', content: 'ελληνικά'}, {value: 'en-AU', content: 'English (Australia)'}, {value: 'en-GB', content: 'English (United Kingdom)'},
            {value: 'en-US', content: 'English (United States)'}, {value: 'es-419', content: 'Español (Latinoamérica)'}, {value: 'es-ES', content: 'Español'},
            {value: 'fi-FI', content: 'Suomi'}, {value: 'fr-CA', content: 'Français (Canada)'}, {value: 'fr-FR', content: 'Français'},
            {value: 'he-IL', content: 'עברית'}, {value: 'hi-IN', content: 'हिन्दी'}, {value: 'hr-HR', content: 'Hrvatski'},
            {value: 'hu-HU', content: 'Magyar'}, {value: 'id-ID', content: 'Bahasa Indonesia'}, {value: 'it-IT', content: 'Italiano'},
            {value: 'ja-JP', content: '日本語'}, {value: 'ko-KR', content: '한국어'}, {value: 'ms-MY', content: 'Bahasa Melayu'},
            {value: 'nb-NO', content: 'Norsk'}, {value: 'nl-NL', content: 'Nederlands'}, {value: 'pl-PL', content: 'Polski'},
            {value: 'pt-BR', content: 'Português (Brasil)'}, {value: 'pt-PT', content: 'Português (Portugal)'}, {value: 'ro-RO', content: 'Română'},
            {value: 'ru-RU', content: 'Русский'}, {value: 'sk-SK', content: 'Slovenčina'}, {value: 'sl-SI', content: 'Slovenščina'},
            {value: 'sv-SE', content: 'Svenska'}, {value: 'th-TH', content: 'ไทย'}, {value: 'tr-TR', content: 'Türkçe'},
            {value: 'uk-UA', content: 'Українська'}, {value: 'vi-VN', content: 'Tiếng Việt'}, {value: 'zh-CN', content: '中文 (中国大陆)'},
            {value: 'zh-HK', content: '中文（香港）'}, {value: 'zh-TW', content: '中文 (台灣)'}
        ];

        async function loadData(language = 'en-US') {
            try {
                currentLanguage = language;
                const [videosResponse, stringsResponse] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/aabytt/custom-screensaver-aerial/refs/heads/new-videos-json/assets/videos.json'),
                    fetch(`https://raw.githubusercontent.com/aabytt/custom-screensaver-aerial/refs/heads/new-videos-json/assets/locales/${language}.json`)
                ]);
                videosData = (await videosResponse.json()).assets;
                stringsData = (await stringsResponse.json()).strings || await stringsResponse.json();

                populateLanguageSelector();
                updateStats();
                renderGallery();
            } catch (e) { console.error(e); }
        }

        function populateLanguageSelector() {
            const select = document.getElementById('languageSelect');
            select.innerHTML = '';
            languageOptions.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang.value;
                option.textContent = lang.content;
                if (lang.value === currentLanguage) option.selected = true;
                select.appendChild(option);
            });
        }

        function updateStats() {
            const totalPOI = videosData.reduce((sum, v) => sum + Object.keys(v.pointsOfInterest || {}).length, 0);
            const locations = new Set(videosData.map(v => stringsData[v.localizedNameKey] || v.localizedNameKey));
            document.getElementById('totalVideos').textContent = videosData.length;
            document.getElementById('totalPOI').textContent = totalPOI;
            document.getElementById('totalLocations').textContent = locations.size;
        }

        function getVideoName(video) { return stringsData[video.localizedNameKey] || video.localizedNameKey || 'Unknown Location'; }
        function getPOIDescription(poiKey) { return stringsData[poiKey] || poiKey; }

        function filterVideos() {
            return videosData.filter(video => {
                const name = getVideoName(video).toLowerCase();
                const matchesSearch = !searchQuery || name.includes(searchQuery.toLowerCase());
                const matchesQuality = currentFilter === 'all' || video[`url-${currentFilter}`] !== undefined;
                return matchesSearch && matchesQuality;
            });
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const filtered = filterVideos();
            if (filtered.length === 0) {
                gallery.innerHTML = '<div class="no-results">No videos found matching your criteria.</div>';
                return;
            }

            gallery.innerHTML = filtered.map(video => {
                const name = getVideoName(video);
                const poiCount = Object.keys(video.pointsOfInterest || {}).length;
                const firstPOI = video.pointsOfInterest?.['0'];
                const description = firstPOI ? getPOIDescription(firstPOI) : 'Aerial view';

                let badgesHTML = '';
                if (video['url-4K-HDR']) badgesHTML += `<span class="quality-badge">4K HDR</span>`;
                if (video['url-4K-SDR']) badgesHTML += `<span class="quality-badge">4K SDR</span>`;
                if (video['url-4K-SDR-240FPS']) badgesHTML += `<span class="quality-badge">4K SDR 240FPS</span>`;
                if (video['url-1080-HDR']) badgesHTML += `<span class="quality-badge">1080 HDR</span>`;
                if (video['url-1080-SDR']) badgesHTML += `<span class="quality-badge">1080 SDR</span>`;
                if (video['url-1080-H264']) badgesHTML += `<span class="quality-badge">1080 H.264</span>`;

                return `
                    <div class="video-card" data-id="${video.id}">
                        <div class="video-preview-container">
                            <img class="video-preview" src="${video.previewImage}" alt="${name}" loading="lazy">
                            <div class="poi-badge">${poiCount} POI</div>
                            <div class="video-overlay">
                                <h3 class="video-title">${name}</h3>
                                <p class="video-description">${description}</p>
                                <div class="video-meta">
                                    <div class="quality-badges">${badgesHTML}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            document.querySelectorAll('.video-card').forEach(card => {
                card.addEventListener('click', () => {
                    const video = videosData.find(v => v.id === card.dataset.id);
                    if (video) openModal(video);
                });
            });
        }

        function openModal(video) {
            const modal = document.getElementById('videoModal');
            const videoEl = document.getElementById('modalVideo');

            document.getElementById('modalTitle').textContent = getVideoName(video);

            videoEl.src = video['url-1080-SDR'] || video['url-1080-H264'] || video['url-4K-SDR'] || video['url-4K-SDR-240FPS'];
            currentPOIs = video.pointsOfInterest || {};

            const qualities = [
                { label: '4K HDR', key: 'url-4K-HDR' },
                { label: '4K SDR', key: 'url-4K-SDR' },
                { label: '4K SDR 240FPS', key: 'url-4K-SDR-240FPS' },
                { label: '1080p HDR', key: 'url-1080-HDR' },
                { label: '1080p SDR', key: 'url-1080-SDR' },
                { label: '1080p H.264', key: 'url-1080-H264' }
            ];
            document.getElementById('modalQualityLinks').innerHTML = qualities
                .filter(q => video[q.key])
                .map(q => `<a href="${video[q.key]}" class="quality-link" download>${q.label}</a>`).join('');

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setupPOIOverlays(videoEl);
        }

        function setupPOIOverlays(videoEl) {
            const overlay = document.getElementById('poiOverlay');
            videoEl.ontimeupdate = () => {
                const time = Math.floor(videoEl.currentTime);
                const poiKey = currentPOIs[time];
                if (poiKey) {
                    overlay.textContent = getPOIDescription(poiKey);
                    overlay.classList.add('show');
                    clearTimeout(poiTimeout);
                    poiTimeout = setTimeout(() => overlay.classList.remove('show'), 6500);
                }
            };
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const videoEl = document.getElementById('modalVideo');
            videoEl.pause();
            videoEl.src = '';
            document.getElementById('poiOverlay').classList.remove('show');
            clearTimeout(poiTimeout);
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderGallery(); });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.quality;
                renderGallery();
            });
        });
        document.getElementById('gridView').addEventListener('click', () => {
            document.getElementById('gallery').classList.remove('list-view');
            document.getElementById('gridView').classList.add('active');
            document.getElementById('listView').classList.remove('active');
        });
        document.getElementById('listView').addEventListener('click', () => {
            document.getElementById('gallery').classList.add('list-view');
            document.getElementById('listView').classList.add('active');
            document.getElementById('gridView').classList.remove('active');
        });
        document.getElementById('languageSelect').addEventListener('change', e => loadData(e.target.value));
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('videoModal').addEventListener('click', e => { if (e.target.id === 'videoModal') closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        // Initialize
        loadData('en-US');
    </script>
</body>
</html>
